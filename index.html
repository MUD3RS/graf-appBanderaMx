
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bandera de México</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="container-fluid">

        <div class="contenedor-principal">

            <!-- TÍTULO -->

            <h1 class="text-center">
                Bandera de México
            </h1>

            <!-- BANDERA -->

            <div class="row g-3">

                <!-- FRANJA VERDE -->

                <div class="col-12 col-md-4">

                    <div class="seccion-color">

                        <label for="controlVerde">
                            Esperanza
                        </label>

                        <input
                            type="range"
                            class="form-range"
                            id="controlVerde"
                            min="0"
                            max="255"
                            value="153"
                        >

                        <p id="codigoVerde">
                            #009900
                        </p>

                        <div
                            class="franja"
                            id="franjaVerde">
                        </div>

                    </div>

                </div>


                <!-- FRANJA BLANCA -->

                <div class="col-12 col-md-4">

                    <div class="seccion-color">

                        <label>
                            Unidad
                        </label>

                        <div class="espacio-control"></div>

                        <p>
                            #FFFFFF
                        </p>

                        <div
                            class="franja franja-blanca"
                            id="franjaBlanca">

                            <!-- ESCUDO NACIONAL -->

                            <img
                                src="escudo.jpg"
                                alt="Escudo Nacional de México"
                                class="escudo-nacional"
                            >

                        </div>

                    </div>

                </div>


                <!-- FRANJA ROJA -->

                <div class="col-12 col-md-4">

                    <div class="seccion-color">

                        <label for="controlRojo">
                            Sangre de nuestros héroes nacionales
                        </label>

                        <input
                            type="range"
                            class="form-range"
                            id="controlRojo"
                            min="0"
                            max="255"
                            value="157"
                        >

                        <p id="codigoRojo">
                            #9D0000
                        </p>

                        <div
                            class="franja"
                            id="franjaRoja">
                        </div>

                    </div>

                </div>

            </div>


            <!-- INTEGRANTES DEL EQUIPO -->

            <section class="integrantes">

                <h2>
                    Integrantes del equipo
                </h2>

                <div class="row justify-content-center g-3">

                    <!-- INTEGRANTE 1 -->

                    <div class="col-12 col-md-5">

                        <div class="tarjeta-integrante">

                            <h3>
                                Cesar Ramses Hurtado Rios
                            </h3>

                            <p>
                                Número de control:
                                <strong>24200090</strong>
                            </p>

                        </div>

                    </div>


                    <!-- INTEGRANTE 2 -->

                    <div class="col-12 col-md-5">

                        <div class="tarjeta-integrante">

                            <h3>
                                Abraham Uriel Zavala Osorio
                            </h3>

                            <p>
                                Número de control:
                                <strong>23201052</strong>
                            </p>

                        </div>

                    </div>

                </div>

            </section>

        </div>

    </main>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
